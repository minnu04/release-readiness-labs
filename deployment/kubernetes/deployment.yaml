apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  labels:
    app.kubernetes.io/name: lab-app
    app.kubernetes.io/version: v2.3.0
    app.kubernetes.io/part-of: orderflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
      - name: lab-app
        image: lab-app:v2.3.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: lab-app-secrets
              key: API_KEY
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab-app-secrets
              key: DATABASE_PASSWORD
